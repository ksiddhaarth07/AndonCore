[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andoncore"
version = "0.1.0"
description = "A governed staging incident triage agent for Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34,<2", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["andoncore*"]

[tool.setuptools.package-data]
andoncore = ["static/*"]
